name: Update profile stats

on:
  schedule:
    - cron: "17 4 * * *" # daily, off the hour to avoid GitHub Actions peak load
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate stats SVGs
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: python scripts/generate_stats.py Ansh-Bire

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streak.svg langs.svg year.svg
          git diff --cached --quiet || git commit -m "chore: update profile stats"
          git push
